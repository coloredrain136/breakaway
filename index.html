      </ol>`;

    // ---- cheers list ----
    const cs = D.cheers || [];
    $('#cCheers').innerHTML = `<h2>Cheers (${cs.length})</h2>${cs.length ? `<ul class="feed" style="max-height:420px">${cs.map((c) => `
      <li><div class="grow ${c.hidden ? 'hid' : ''}"><span class="who">${esc(c.name || 'Someone')}</span> ${c.kind === 'msg' ? esc(c.text) : c.kind === 'voice' ? `🎙️ Voice${c.audio_secs ? ` (${Math.round(c.audio_secs)}s)` : ''}` : `${esc(c.emoji)}×${c.count}`}
      <div class="tiny">${shortAgo(c.created_at)} ago${c.pushed ? ' · pushed' : ''}${c.kind === 'voice' ? (c.played_at ? ' · played' : ' · not played yet') : ''}${c.hidden ? ' · hidden' : ''}</div></div>
      ${c.kind === 'voice' ? `<button class="btn" style="min-height:36px;font-size:13px" data-play="${c.id}">Play</button>` : ''}
      ${c.kind !== 'quick' ? `<button class="btn" style="min-height:36px;font-size:13px" data-hide="${c.id}" data-h="${c.hidden ? 0 : 1}">${c.hidden ? 'Unhide' : 'Hide'}</button>` : ''}</li>`).join('')}</ul>` : '<p class="sub">No cheers yet.</p>'}`;
    document.querySelectorAll('[data-hide]').forEach((b) => b.onclick = () => act({ action: 'hide', id: Number(b.dataset.hide), hidden: b.dataset.h === '1' }, b.dataset.h === '1' ? 'Hidden' : 'Unhidden'));
    document.querySelectorAll('[data-play]').forEach((b) => b.onclick = async () => {
      try {
        const r = await fetch(`/api/admin?voice=${b.dataset.play}`, { headers: { 'x-admin-pass': pass } });
        if (!r.ok) throw new Error('Could not load that clip');
        const a = new Audio(URL.createObjectURL(await r.blob())); await a.play();
      } catch (e) { toast(e.message || 'Could not play that clip'); }
    });

    // ---- danger ----
    $('#cDanger').innerHTML = `<h2>Race Controls &amp; Test Data</h2>
      ${st === 'live' ? `<p class="sub" style="margin-top:0">Only if it didn’t finish by itself.</p><button class="btn danger block hold" id="bEnd"><span class="holdfill"></span><span class="holdlbl">Hold to End Race</span></button>` : ''}
      ${st !== 'not_started' ? `<button class="btn block" id="bNS" style="margin-top:8px">Set Not Started</button>` : ''}
      <p class="sub" style="margin:14px 0 8px">After a test ride, clear it so race day starts clean. Deletes all points and cheers and sets the race to Not Started. Setup, course and followers’ notifications stay.</p>
      <button class="btn danger block" id="bClear">Clear Test Data</button>`;
    if ($('#bEnd')) holdBtn($('#bEnd'), 1500, () => act({ action: 'end' }, 'Race ended'));
    if ($('#bNS')) armed($('#bNS'), 'Tap Again to Confirm', () => act({ action: 'not_started' }, 'Set to Not Started'));
    armed($('#bClear'), 'Tap Again to Delete Everything', () => act({ action: 'clear_data' }, 'Cleared'));

    document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => copy(b.dataset.copy));
  }
  setInterval(() => {
    if (!D) return;
    const R = D.race, e = $('#aElapsed');
    if (e && R.started_at && R.status === 'live') e.textContent = dur((now() - Date.parse(R.started_at)) / 1000);
    document.querySelectorAll('[data-ago]').forEach((x) => { if (x.dataset.ago) x.textContent = ago(x.dataset.ago); });
  }, 1000);

  function toLocalInput(iso) {
    if (!iso) return '';
    const d = new Date(iso); const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function renderSetup() {
    const R = D.race;
    $('#cSetup').innerHTML = `<h2>Race Setup</h2>
      <label class="lbl">Race Name</label><input class="field" id="fName" maxlength="60" value="${esc(R.name)}">
      <label class="lbl">Rider Name (shown to followers)</label><input class="field" id="fRider" maxlength="24" value="${esc(R.rider_name || 'Joe')}">
      <label class="lbl">Race Date</label><input class="field" id="fDate" type="date" value="${esc(R.race_date || '')}">
      <label class="lbl">Planned Start (your wave)</label><input class="field" id="fStart" type="datetime-local" value="${toLocalInput(R.planned_start)}">
      <label class="lbl">Max Speed Filter (mph)</label><input class="field" id="fMax" type="number" inputmode="numeric" min="10" max="150" value="${esc(R.max_mph ?? 40)}">
      <p class="tiny" style="margin-top:4px">GPS jumps faster than this get ignored. Keep 40 for the race. Set 90 for a car test.</p>
      <label class="lbl">Course (GPX)</label>
      <div class="sub" id="courseInfo">${R.course_miles ? `${esc(R.course_name || 'course.gpx')} · <b class="num">${R.course_miles.toFixed(2)} mi</b>` : 'No course uploaded yet.'}</div>
      <label class="btn block" style="margin-top:8px">Upload GPX<input type="file" id="fGpx" class="hidden"></label>
      <div class="pmapwrap"><div id="pmap"></div></div>
      <button class="btn primary block" id="bSave" style="margin-top:12px">Save Setup</button>`;
    pmap = L.map('pmap', { zoomControl: false, attributionControl: true, dragging: true }).setView([44.73, -85.37], 10);
    pmap.attributionControl.setPrefix(false);
    tiles().sat.addTo(pmap); pLayer = L.layerGroup().addTo(pmap);
    if (D.share) {
      const k = new URL(D.share).searchParams.get('k');
      fetch(`/api/state?k=${encodeURIComponent(k)}&part=course`, { cache: 'no-store' }).then((r) => r.json()).then((j) => {
        if (pendingCourse || !j.course) return;
        const b = drawCourse(pmap, j.course.pts, pLayer); if (b) pmap.fitBounds(b, { padding: [16, 16] });
      }).catch(() => {});
    }
    $('#fGpx').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const text = await f.text();
        const c = parseGpx(text);
        pendingCourse = { ...c, name: f.name };
        $('#courseInfo').innerHTML = `New: ${esc(f.name)} · <b class="num">${(c.total_m / MI).toFixed(2)} mi</b> · ${c.raw.toLocaleString()} → ${c.pts.length.toLocaleString()} points <span style="color:var(--warn)">(not saved yet)</span>`;
        const b = drawCourse(pmap, c.pts, pLayer); if (b) pmap.fitBounds(b, { padding: [16, 16] });
      } catch (err) { toast(err.message, 3500); }
      e.target.value = '';
    };
    $('#bSave').onclick = async () => {
      const body = {
        action: 'save', name: $('#fName').value, rider: $('#fRider').value, raceDate: $('#fDate').value,
        plannedStart: $('#fStart').value ? new Date($('#fStart').value).toISOString() : null,
        maxMph: Number($('#fMax').value) || 40
      };
      if (pendingCourse) { body.course = { pts: pendingCourse.pts }; body.courseName = pendingCourse.name; }
      const btn = $('#bSave'); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await api('POST', body); toast('Setup saved');
        if (pendingCourse) $('#courseInfo').innerHTML = `${esc(pendingCourse.name)} · <b class="num">${(pendingCourse.total_m / MI).toFixed(2)} mi</b> · saved`;
        pendingCourse = null; await load();
      } catch (e) { if (e.message !== 'auth') toast(e.message, 3500); }
      btn.disabled = false; btn.textContent = 'Save Setup';
    };
  }
}

// =====================================================================
// RACE MODE — Joe's race-day screen. CarPlay-style dashboard (portrait + landscape),
// one Start button, voice messages out loud with the phone locked.
// Audio: one element loops an 8 s near-silent WAV (keeps Safari alive when locked)
// and swaps in chime → clip for each new voice message.
// =====================================================================
function RaceMode() {
  let pass = store.get('ba_admin') || '';
  let R = null, items = [], lastId = 0, epoch = null, lastCheck = 0, checking = false, checkStarted = 0;
  let started = false, player = null, mode = 'idle', playing = null, queue = [], ready = {}, failed = new Set(), stoppedByUs = false;
  let map = null, courseLayer = null, dot = null, courseVer = -1, courseBounds = null, follow = true, flashId = null;
  const SILENCE = makeWav(8, 8000, () => (Math.random() - 0.5) * 0.0001);
  const CHIME = makeWav(1.2, 22050, (t) => {
    const n1 = Math.exp(-t * 6) * Math.sin(2 * Math.PI * 880 * t);
    const t2 = t - 0.16, n2 = t2 > 0 ? Math.exp(-t2 * 4) * Math.sin(2 * Math.PI * 1318.5 * t2) : 0;
    return 0.38 * n1 + 0.42 * n2 + 0.06 * Math.sin(2 * Math.PI * 2637 * t) * Math.exp(-t * 9);
  });
  document.body.classList.add('rmode');

  if (!pass) return login();
  shell(); check(true);
  setInterval(() => { if (!document.hidden) { check(); tick(); } }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { check(true); paintAll(); } });
  window.addEventListener('resize', () => { if (map) setTimeout(() => { map.invalidateSize(); recenter(false); }, 250); });

  function login(err) {
    $('#app').innerHTML = `<div class="wrap"><div class="top"><div class="brand"><img src="/icons/race-192.png" alt=""><div><div class="t1">Breakaway</div><div class="t2">Race Mode</div></div></div></div>
      <div class="card"><h3>Enter Passcode</h3><p class="sub" style="margin-top:0">Same passcode as Admin. Saved after the first time.</p>
      <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Passcode">
      ${err ? `<p class="tiny" style="color:var(--bad)">${esc(err)}</p>` : ''}
      <button class="btn primary block" id="go" style="margin-top:12px">Unlock</button></div></div>`;
    const go = () => { const v = $('#pw').value.trim(); if (!v) return; pass = v; store.set('ba_admin', v); shell(); check(true); };
    $('#go').onclick = go; $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  async function api(method, qs, body) {
    const r = await fetch('/api/admin' + (qs || ''), { method, cache: 'no-store', headers: { 'Content-Type': 'application/json', 'x-admin-pass': pass }, body: body ? JSON.stringify({ v: APP_VERSION, ...body }) : undefined });
    if (r.status === 401) { store.del('ba_admin'); pass = ''; login('Wrong passcode. Try again.'); throw new Error('auth'); }
    if (r.status === 409) { showUpdate(); throw new Error('Update ready, tap reload'); }
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || `Error ${r.status}`); }
    return r;
  }

  // ---------- layout ----------
  function shell() {
    $('#app').innerHTML = `<div class="rmx">
      <div class="rm-map"><div id="rmMap"></div>
        <button class="recenter on" id="rmRec" aria-label="Recenter Map">${RECENTER_SVG}</button></div>
      <div class="rm-side">
        <div class="rm-bar">
          <span class="rm-pill" id="rmStatus"><span class="dot"></span>…</span>
          <span class="rm-bar-r"><span id="rmGpsMini" class="rm-mini"><span class="dot"></span>GPS</span><span id="rmBatt" class="rm-mini num">🔋 —</span></span>
        </div>
        <div class="rm-hero">
          <div class="rm-k" id="rmHeroK">Miles Left</div>
          <div class="rm-big num" id="rmHero">—</div>
          <div class="rm-sub num" id="rmHeroSub"></div>
        </div>
        <div class="rm-tiles">
          <div class="rm-tile"><div class="rm-k">ETA</div><div class="rm-v num" id="rmEta">—</div></div>
          <div class="rm-tile"><div class="rm-k">Speed</div><div class="rm-v num" id="rmSpeed">—</div></div>
          <div class="rm-tile"><div class="rm-k">Elapsed</div><div class="rm-v num" id="rmElapsed">—</div></div>
        </div>
        <div class="rm-banner" id="rmBanner"></div>
        <div id="rmStart"></div>
      </div>
      <div class="rm-more">
        <div class="card" id="rmControls"></div>
        <div class="card"><h2>All Cheers</h2><ul class="feed rmfeed" id="rmFeed"></ul></div>
        <p class="tiny" style="text-align:center">${APP_VERSION}</p>
      </div>
    </div>`;
    map = L.map('rmMap', { zoomControl: false, attributionControl: true }).setView([44.73, -85.37], 10);
    map.attributionControl.setPrefix(false);
    tiles().sat.addTo(map);
    courseLayer = L.layerGroup().addTo(map);
    map.on('dragstart', () => setFollow(false));
    $('#rmRec').onclick = () => { setFollow(true); recenter(true); };
    paintAll();
  }
  function setFollow(on) { follow = on; const b = $('#rmRec'); if (b) b.classList.toggle('on', on); }
  function recenter(force) {
    if (!map) return;
    if (R && R.cur && R.status === 'live') { if (follow || force) map.setView([R.cur.lat, R.cur.lon], Math.max(map.getZoom(), 14)); }
    else if (courseBounds && (follow || force)) map.fitBounds(courseBounds, { padding: [20, 20] });
    else if (R && R.cur && (follow || force)) map.setView([R.cur.lat, R.cur.lon], 13);
  }
  async function loadCourse() {
    try {
      const j = await (await api('GET', '?part=course')).json();
      courseVer = j.courseVersion;
      courseBounds = drawCourse(map, j.course && j.course.pts, courseLayer);
      recenter(true);
    } catch {}
  }

  // ---------- polling ----------
  async function check(force) {
    if (!pass) return;
    if (checking && Date.now() - checkStarted < 15000) return;   // a request frozen by iOS can't block us forever
    if (!force && Date.now() - lastCheck < 4500) return;
    checking = true; checkStarted = Date.now();
    try {
      const r = await api('GET', `?part=race&since=${lastId}`);
      const j = await r.json();
      lastCheck = Date.now();
      if (j.now) skew = Date.parse(j.now) - Date.now();
      if (j.v && j.v !== APP_VERSION) showUpdate();
      if (epoch !== null && j.epoch !== epoch) { items = []; lastId = 0; queue = []; checking = false; epoch = j.epoch; return check(true); }
      epoch = j.epoch;
      R = j;
      if (map && j.courseVersion !== courseVer) loadCourse();
      const fresh = (j.cheers || []).filter((c) => Number(c.id) > lastId).sort((a, b) => Number(a.id) - Number(b.id));
      for (const c of fresh) {
        items.unshift(c); lastId = Math.max(lastId, Number(c.id));
        if (c.kind === 'voice' && !c.played_at && !queue.includes(c.id)) { queue.push(c.id); prefetch(c.id); }
        if (lastCheck && fresh.length < 10) flashId = c.id;
      }
      if (items.length > 300) items.length = 300;
      paintAll();
    } catch (e) { /* shown via the GPS/check status */ }
    checking = false;
  }

  async function prefetch(id) {
    if (ready[id]) return;
    try {
      const r = await api('GET', `?voice=${id}`);
      ready[id] = URL.createObjectURL(await r.blob());
      if (started && mode === 'silence') next();
    } catch (e) { setTimeout(() => prefetch(id), 8000); }
  }

  // ---------- audio engine (unchanged from breakaway-2) ----------
  function startAudio() {
    if (!player) {
      player = new Audio();
      player.preload = 'auto';
      player.setAttribute('playsinline', '');
      player.addEventListener('ended', onEnded);
      player.addEventListener('error', onError);
      player.addEventListener('pause', () => { if (!stoppedByUs && !player.ended) setTimeout(paintAll, 300); });
      player.addEventListener('playing', paintAll);
    }
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
    try {
      if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: 'Race Mode', artist: 'Breakaway', artwork: [{ src: '/icons/race-512.png', sizes: '512x512', type: 'image/png' }] });
    } catch {}
    started = true; stoppedByUs = false;
    next();
  }
  function stopAudio() {
    started = false; stoppedByUs = true; mode = 'idle';
    if (player) { player.pause(); player.removeAttribute('src'); player.load(); }
    paintAll();
  }
  function playSrc(src, m) {
    mode = m; stoppedByUs = true; player.src = src;
    const p = player.play(); stoppedByUs = false;
    if (p && p.catch) p.catch(() => paintAll());
  }
  function next() {
    if (!started) return;
    const id = R && R.voiceOn === false ? null : queue.find((i) => ready[i]);
    if (id != null) { playing = id; playSrc(CHIME, 'chime'); }
    else playSrc(SILENCE, 'silence');
    paintBanner();
  }
  function onEnded() {
    if (mode === 'chime') { playSrc(ready[playing], 'clip'); paintBanner(); paintFeed(); return; }
    if (mode === 'clip') finishClip(playing);
    const wasSilence = mode === 'silence';
    next();
    if (wasSilence) check();
  }
  function onError() {
    if (mode === 'clip' && playing != null) { failed.add(playing); finishClip(playing); toast('Couldn’t play one voice message. It’s in Admin.'); }
    if (started) setTimeout(next, 500);
  }
  function finishClip(id) {
    queue = queue.filter((x) => x !== id);
    const it = items.find((c) => c.id === id); if (it) it.played_at = new Date().toISOString();
    playing = null;
    api('POST', '', { action: 'played', id: Number(id) }).catch(() => {});
    paintAll();
  }
  function playNow(id) {
    if (!ready[id]) { prefetch(id); toast('Loading…'); return; }
    if (!started) startAudio();
    queue = [id, ...queue.filter((x) => x !== id)];
    playing = id; playSrc(ready[id], 'clip'); paintAll();
  }

  // ---------- one Start button ----------
  async function startMyRace() {
    startAudio();                       // must happen inside the tap (iPhone audio rule)
    paintAll();
    try {
      const j = await (await api('POST', '', { action: 'arm' })).json();
      if (R) R.status = j.status || R.status;
      toast(j.status === 'live' ? 'You’re live 🚴' : j.armed ? 'Ready. It goes Live when you roll out.' : 'Race Mode on');
    } catch (e) { if (e.message !== 'auth') toast(e.message); }
    check(true);
  }

  // ---------- status helpers ----------
  function gpsState() {
    if (!R || !R.lastIngestAt) return { cls: 'bad', txt: 'GPS Off', long: 'Overland hasn’t sent anything' };
    const s = (now() - Date.parse(R.lastIngestAt)) / 1000;
    if (s < 90) return { cls: 'ok', txt: 'GPS', long: 'GPS sending' };
    if (s < 300) return { cls: 'warn', txt: 'GPS', long: `GPS quiet ${Math.round(s / 60)}m (dead zone?)` };
    return { cls: 'bad', txt: 'GPS Off', long: `GPS off · last heard ${ago(R.lastIngestAt)}` };
  }
  function listenState() {
    if (!started) return { cls: 'bad', txt: 'Voice Off' };
    if (player && player.paused && !player.ended) return { cls: 'warn', txt: 'Paused' };
    return { cls: 'ok', txt: 'Listening' };
  }
  function raceState() {
    if (!R) return { cls: '', txt: '…' };
    if (R.status === 'live') return { cls: 'live', txt: 'Live' };
    if (R.status === 'finished') return { cls: 'ok', txt: 'Finished' };
    if (R.hasCourse && R.plannedStart) return { cls: 'arm', txt: `Ready · ${clock(R.plannedStart)}` };
    return { cls: 'warn', txt: 'Not Set Up' };
  }

  // ---------- painting ----------
  function paintAll() { paintTop(); paintHero(); paintBanner(); paintStart(); paintControls(); paintFeed(); paintMap(); }
  function paintTop() {
    const rs = raceState(), g = gpsState();
    const st = $('#rmStatus'); if (!st) return;
    st.className = 'rm-pill ' + rs.cls;
    st.innerHTML = `<span class="dot ${rs.cls === 'live' ? 'live' : rs.cls === 'ok' ? 'ok' : rs.cls === 'warn' ? 'warn' : ''}"></span>${esc(rs.txt)}`;
    $('#rmGpsMini').innerHTML = `<span class="dot ${g.cls}"></span>${g.txt}`;
    $('#rmBatt').textContent = R && R.battery != null ? `🔋 ${Math.round(R.battery)}%` : '🔋 —';
  }
  function paintHero() {
    if (!R) return;
    const K = $('#rmHeroK'), H = $('#rmHero'), S = $('#rmHeroSub');
    if (R.status === 'finished') {
      const t = R.startedAt && R.finishedAt ? (Date.parse(R.finishedAt) - Date.parse(R.startedAt)) / 1000 : null;
      K.textContent = 'Finished 🎉'; H.textContent = dur(t); S.textContent = R.avgMph ? `Avg ${R.avgMph} mph` : '';
    } else if (R.status === 'live') {
      if (R.milesLeft != null) { K.textContent = 'Miles Left'; H.innerHTML = `${R.milesLeft.toFixed(1)}`; S.textContent = R.milesDone != null && R.courseMiles ? `${R.milesDone.toFixed(1)} of ${R.courseMiles.toFixed(1)} mi done` : ''; }
      else { K.textContent = 'Speed'; H.innerHTML = R.speedMph != null ? `${R.speedMph.toFixed(0)}<small>mph</small>` : '—'; S.textContent = R.hasCourse ? 'Finding you on the course…' : 'No course loaded (test)'; }
    } else if (R.plannedStart) {
      K.textContent = 'Starts In'; H.textContent = '—'; S.textContent = `Your wave · ${clock(R.plannedStart)}`;
    } else { K.textContent = 'Not Set Up'; H.textContent = '—'; S.textContent = 'Set your wave time in Admin'; }
    tick();
  }
  function tick() {
    if (!R) return;
    if (R.status !== 'live' && R.status !== 'finished' && R.plannedStart) {
      const sec = (Date.parse(R.plannedStart) - now()) / 1000;
      const H = $('#rmHero'); if (H) H.textContent = sec > 0 ? countdown(sec) : 'Roll Out';
    }
    const el = R.startedAt ? ((R.status === 'finished' && R.finishedAt ? Date.parse(R.finishedAt) : now()) - Date.parse(R.startedAt)) / 1000 : null;
    const E = $('#rmElapsed'); if (E) E.textContent = el != null ? dur(el) : '—';
    const eta = $('#rmEta'); if (eta) eta.textContent = R.status === 'live' && R.eta ? clock(R.eta) : R.status === 'finished' ? clock(R.finishedAt) : '—';
    const sp = $('#rmSpeed'); if (sp) sp.innerHTML = R.status === 'live' && R.speedMph != null ? `${R.speedMph.toFixed(0)}<small>mph</small>` : R.status === 'finished' && R.avgMph ? `${R.avgMph}<small>avg</small>` : '—';
    const g = gpsState(); const gm = $('#rmGpsMini'); if (gm) gm.innerHTML = `<span class="dot ${g.cls}"></span>${g.txt}`;
    const ck = $('#rmChecks'); if (ck) paintChecks(ck);
  }
  function paintBanner() {
    const b = $('#rmBanner'); if (!b) return;
    if ((mode === 'chime' || mode === 'clip') && playing != null) {
      const c = items.find((x) => x.id === playing);
      b.className = 'rm-banner playing';
      b.innerHTML = `<span class="rm-eq"><i></i><i></i><i></i><i></i></span><div class="grow"><div class="rm-k">Playing Voice Message</div><div class="rm-bt">${esc(c ? c.name || 'Someone' : 'Someone')}${c && c.audio_secs ? ` · ${Math.round(c.audio_secs)}s` : ''}</div></div>`;
      return;
    }
    const c = items[0];
    if (!c) { b.className = 'rm-banner'; b.innerHTML = `<span class="av">💬</span><div class="grow"><div class="rm-k">Cheers</div><div class="rm-bt" style="color:var(--ink2)">None yet. They’ll show up here.</div></div>`; return; }
    const body = c.kind === 'msg' ? esc(c.text) : c.kind === 'voice' ? `🎙️ Voice message${c.audio_secs ? ` · ${Math.round(c.audio_secs)}s` : ''}` : `${esc(c.emoji)}${c.count > 1 ? `×${c.count}` : ''}`;
    b.className = 'rm-banner' + (flashId === c.id ? ' flash' : '');
    b.innerHTML = `<span class="av">${esc((c.name || 'S').slice(0, 1).toUpperCase())}</span><div class="grow"><div class="rm-k">${esc(c.name || 'Someone')} · ${shortAgo(c.created_at)} ago</div><div class="rm-bt">${body}</div></div>`;
    if (flashId === c.id) setTimeout(() => { flashId = null; b.classList.remove('flash'); }, 8000);
  }
  function paintChecks(el) {
    const g = gpsState(), l = listenState(), r = raceState();
    el.innerHTML = `
      <div class="rm-check ${g.cls}"><span class="dot ${g.cls}"></span><span>${esc(g.long)}</span>${g.cls === 'bad' ? `<a class="btn rm-mini-btn" href="overland://">Open Overland</a>` : ''}</div>
      <div class="rm-check ${l.cls}"><span class="dot ${l.cls}"></span><span>${l.txt === 'Listening' ? 'Voice messages: listening' : l.txt === 'Paused' ? 'Voice paused' : 'Voice messages: off'}</span>${l.cls === 'warn' ? `<button class="btn rm-mini-btn" id="rmResume">Resume</button>` : ''}</div>
      <div class="rm-check ${r.cls === 'live' || r.cls === 'arm' || r.cls === 'ok' ? 'ok' : 'warn'}"><span class="dot ${r.cls === 'live' ? 'live' : r.cls === 'arm' || r.cls === 'ok' ? 'ok' : 'warn'}"></span><span>${R && R.status === 'live' ? 'Race is Live' : R && R.status === 'finished' ? 'Race finished' : r.cls === 'arm' ? `Goes Live when you roll out (wave ${clock(R.plannedStart)})` : 'No course / wave time yet'}</span></div>`;
    const rb = $('#rmResume'); if (rb) rb.onclick = () => next();
  }
  function paintStart() {
    const el = $('#rmStart'); if (!el) return;
    if (!started) {
      el.innerHTML = `<button class="btn primary block rm-go" id="rmGo">Start My Race</button>
        <p class="tiny" style="text-align:center;margin:6px 0 0">Overland on first. Then tap this, lock your phone, and ride.</p>
        <div class="rm-checks" id="rmChecks"></div>`;
      $('#rmGo').onclick = startMyRace;
    } else {
      const late = R && R.status === 'not_started' && R.plannedStart && now() - Date.parse(R.plannedStart) > 3 * 60000;
      el.innerHTML = `<div class="rm-checks" id="rmChecks"></div>
        ${late ? `<button class="btn ok block hold" id="rmLive" style="margin-top:8px"><span class="holdfill" style="background:rgba(91,227,160,.4)"></span><span class="holdlbl">Didn’t go Live? Hold to Go Live Now</span></button>` : ''}`;
      if ($('#rmLive')) holdBtn($('#rmLive'), 1200, async () => { try { await api('POST', '', { action: 'golive' }); toast('You’re live 🚴'); check(true); } catch (e) { toast(e.message); } });
    }
    const ck = $('#rmChecks'); if (ck) paintChecks(ck);
  }
  function paintControls() {
    const el = $('#rmControls'); if (!el) return;
    el.innerHTML = `<div class="toggle"><div><div style="font-weight:650">Play Voice Messages</div><div class="tiny">Off = they still save, nothing plays.</div></div>
        <label class="sw ok"><input type="checkbox" id="rmVoice" ${!R || R.voiceOn ? 'checked' : ''}><span></span></label></div>
      <div class="toggle"><div><div style="font-weight:650">Mute Cheers to Watch</div><div class="tiny">Stops Watch buzzes. Cheers still show here.</div></div>
        <label class="sw"><input type="checkbox" id="rmMute" ${R && R.mute ? 'checked' : ''}><span></span></label></div>
      <div class="row" style="margin-top:8px"><button class="btn grow" id="rmTest">Play Test Chime</button>${started ? `<button class="btn grow" id="rmStop">Stop Voice</button>` : ''}</div>`;
    $('#rmVoice').onchange = async (e) => { try { await api('POST', '', { action: 'voice', on: e.target.checked }); if (R) R.voiceOn = e.target.checked; toast(e.target.checked ? 'Voice messages on' : 'Voice messages off'); } catch (err) { toast(err.message); } };
    $('#rmMute').onchange = async (e) => { try { await api('POST', '', { action: 'mute', on: e.target.checked }); if (R) R.mute = e.target.checked; toast(e.target.checked ? 'Watch muted' : 'Watch unmuted'); } catch (err) { toast(err.message); } };
    $('#rmTest').onclick = () => { const a = new Audio(CHIME); a.play().catch(() => {}); };
    if ($('#rmStop')) $('#rmStop').onclick = stopAudio;
  }
  function paintFeed() {
    const ul = $('#rmFeed'); if (!ul) return;
    if (!items.length) { ul.innerHTML = `<li class="tiny" style="justify-content:center">No cheers yet.</li>`; return; }
    ul.innerHTML = items.map((c) => {
      const who = esc(c.name || 'Someone');
      let body;
      if (c.kind === 'msg') body = `<div class="rmtext">${esc(c.text)}</div>`;
      else if (c.kind === 'voice') {
        const state = playing === c.id ? '🔊 Playing' : failed.has(c.id) ? 'Couldn’t play' : c.played_at ? 'Played' : 'New';
        body = `<div class="row" style="margin-top:4px"><span>🎙️ ${c.audio_secs ? Math.round(c.audio_secs) + 's' : 'Voice'} · ${state}</span><button class="btn" style="min-height:34px;font-size:13px;margin-left:auto" data-rplay="${c.id}">Play</button></div>`;
      } else body = `<span>${esc(c.emoji)}${c.count > 1 ? `×${c.count}` : ''}</span>`;
      return `<li><span class="av">${esc((c.name || 'S').slice(0, 1).toUpperCase())}</span><div class="grow"><span class="who">${who}</span> <span class="when" style="float:right">${shortAgo(c.created_at)}</span>${body}</div></li>`;
    }).join('');
    ul.querySelectorAll('[data-rplay]').forEach((b) => b.onclick = () => { const it = items.find((c) => String(c.id) === b.dataset.rplay); if (it) playNow(it.id); });
  }
  function paintMap() {
    if (!map || !R) return;
    if (R.cur) {
      const ll = [R.cur.lat, R.cur.lon];
      if (!dot) {
        dot = L.marker(ll, { icon: L.divIcon({ className: 'rider', html: '<div class="ring"></div><div class="core"></div>', iconSize: [0, 0] }), zIndexOffset: 1000, interactive: false }).addTo(map);
        if (follow) map.setView(ll, Math.max(map.getZoom(), 14));
      } else dot.setLatLng(ll);
      if (follow && R.status === 'live') map.panTo(ll, { animate: true });
    } else if (dot) { map.removeLayer(dot); dot = null; }
  }
}

// ---------- GPX ----------
function hav(a, b, c, d) {
  const R = 6371008.8, t = Math.PI / 180, dLat = (c - a) * t, dLon = (d - b) * t;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * t) * Math.cos(c * t) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('That file isn’t a valid GPX');
  let nodes = [...doc.getElementsByTagNameNS('*', 'trkpt')];
  if (nodes.length < 2) nodes = [...doc.getElementsByTagNameNS('*', 'rtept')];
  const raw = [];
  for (const n of nodes) {
    const lat = parseFloat(n.getAttribute('lat')), lon = parseFloat(n.getAttribute('lon'));
    if (!isFinite(lat) || !isFinite(lon)) continue;
    const e = n.getElementsByTagNameNS('*', 'ele')[0]; const ele = e ? parseFloat(e.textContent) : null;
    const last = raw[raw.length - 1];
    if (last && last[0] === lat && last[1] === lon) continue;
    raw.push([lat, lon, isFinite(ele) ? ele : null]);
  }
  if (raw.length < 2) throw new Error('No track points found in that GPX');
  // cumulative distance on the full-resolution line
  const cum = [0];
  for (let i = 1; i < raw.length; i++) cum.push(cum[i - 1] + hav(raw[i - 1][0], raw[i - 1][1], raw[i][0], raw[i][1]));
  // simplify (Douglas-Peucker in local meters), keep ≤ 4000 points
  const lat0 = raw[0][0], kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;
  const xy = raw.map((p) => [(p[1] - raw[0][1]) * kx, (p[0] - lat0) * ky]);
  let tol = 3, keep;
  do { keep = dp(xy, tol); tol *= 1.6; } while (keep.length > 4000);
  const pts = keep.map((i) => [raw[i][0], raw[i][1], Math.round(cum[i] * 10) / 10, raw[i][2] != null ? Math.round(raw[i][2] * 10) / 10 : null]);
  return { pts, total_m: cum[cum.length - 1], raw: raw.length };
}
function dp(xy, tol) {
  const n = xy.length, keep = new Uint8Array(n); keep[0] = keep[n - 1] = 1;
  const stack = [[0, n - 1]];
  while (stack.length) {
    const [a, b] = stack.pop(); let max = 0, idx = -1;
    const [ax, ay] = xy[a], [bx, by] = xy[b], dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    for (let i = a + 1; i < b; i++) {
      const [px, py] = xy[i];
      let t = L2 ? ((px - ax) * dx + (py - ay) * dy) / L2 : 0; t = Math.max(0, Math.min(1, t));
      const ex = ax + t * dx - px, ey = ay + t * dy - py, d = ex * ex + ey * ey;
      if (d > max) { max = d; idx = i; }
    }
    if (idx > 0 && max > tol * tol) { keep[idx] = 1; stack.push([a, idx], [idx, b]); }
  }
  const out = []; for (let i = 0; i < n; i++) if (keep[i]) out.push(i); return out;
}

// version check every 5 min (catches deploys while the page is open)
setInterval(() => { fetch('/version.json', { cache: 'no-store' }).then((r) => r.json()).then((j) => { if (j.version && j.version !== APP_VERSION) showUpdate(); }).catch(() => {}); }, 300000);

route();
