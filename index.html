<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a1220">
<meta name="apple-mobile-web-app-capable" content="yes" id="metaCapable">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breakaway" id="metaTitle">
<title>Breakaway</title>
<link rel="manifest" href="/manifest.webmanifest" id="lnkManifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="lnkIcon">
<script>
// Three separate home-screen apps on one page: / (followers), /admin, /race.
// Old #admin / #race links get moved to the real paths. Each path gets its own icon, name and manifest.
(function () {
  var p = location.pathname.replace(/\/+$/, '') || '/', h = location.hash;
  if (h === '#race' && p !== '/race') { location.replace('/race'); return; }
  if (h === '#admin' && p !== '/admin') { location.replace('/admin'); return; }
  var m = { '/admin': ['admin', 'Admin', 'yes'], '/race': ['race', 'Race Mode', 'no'] }[p];
  if (!m) return;
  document.getElementById('lnkManifest').href = '/manifest-' + m[0] + '.webmanifest';
  document.getElementById('lnkIcon').href = '/icons/' + m[0] + '-touch-icon.png?v=2';
  document.getElementById('metaTitle').content = m[1];
  document.getElementById('metaCapable').content = m[2];
  document.title = m[1];
})();
</script>
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#05080d; --bg2:#0a1220;
  --ink:#eef6ff; --ink2:rgba(238,246,255,.68); --ink3:rgba(238,246,255,.42);
  --accent:#7fd6ff; --accent2:#c4efff; --accentDim:rgba(127,214,255,.16); --accentLine:rgba(127,214,255,.38);
  --ok:#5be3a0; --warn:#ffc864; --bad:#ff6f6f;
  --glass:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.032));
  --glass2:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.05));
  --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.18);
  --spec:inset 0 1px 0 rgba(255,255,255,.14);
  --shadow:0 12px 34px rgba(0,0,0,.42);
  --r1:24px; --r2:18px; --r3:13px; --r4:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:28px;
  --blur:blur(22px) saturate(150%);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --topPad:calc(env(safe-area-inset-top) + 14px);
}
html.standalone{--topPad:calc(env(safe-area-inset-top) + 26px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html{background:var(--bg2)}
/* Top edge is a flat #0a1220 (same as theme-color) so the status bar area blends in with no seam. */
body{min-height:100vh;background:
  linear-gradient(180deg,var(--bg2) 0,rgba(10,18,32,.85) 90px,rgba(10,18,32,0) 320px),
  radial-gradient(120% 60% at 15% 8%,rgba(80,170,230,.16),transparent 60%),
  radial-gradient(90% 50% at 110% 18%,rgba(120,200,255,.10),transparent 60%),
  linear-gradient(180deg,var(--bg2),var(--bg) 55%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:var(--topPad) var(--s4) calc(env(safe-area-inset-bottom) + 40px)}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- Glass ---------- */
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:var(--r1);box-shadow:var(--spec),var(--shadow);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);padding:var(--s4);margin-bottom:var(--s3)}
.card h2{font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0 0 var(--s3)}
.card h3{font-size:17px;font-weight:650;margin:0 0 var(--s2)}
.sub{color:var(--ink2);font-size:14px;line-height:1.4}
.tiny{color:var(--ink3);font-size:12px;line-height:1.4}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 var(--s4);border-radius:var(--r3);
  border:1px solid var(--stroke2);background:var(--glass2);box-shadow:var(--spec);font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;
  transition:transform .12s ease,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#9fe2ff,#5cc4f2);color:#04131d;border-color:rgba(255,255,255,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(92,196,242,.32)}
.btn.danger{color:#ffd2d2;border-color:rgba(255,111,111,.4);background:linear-gradient(180deg,rgba(255,111,111,.22),rgba(255,111,111,.08))}
.btn.confirm{background:linear-gradient(180deg,#ff8a8a,#e65454);color:#fff;border-color:rgba(255,255,255,.35)}
.btn.ok{color:#d6ffe9;border-color:rgba(91,227,160,.4);background:linear-gradient(180deg,rgba(91,227,160,.24),rgba(91,227,160,.08))}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.btn.hold{position:relative;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.btn.hold .holdfill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,111,111,.45)}
.btn.hold .holdlbl{position:relative}
.row{display:flex;gap:var(--s2);align-items:center}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:var(--r4);font-size:13px;font-weight:600;border:1px solid var(--stroke2);background:var(--glass2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}
.dot.live{background:var(--bad);box-shadow:0 0 0 0 rgba(255,111,111,.7);animation:livepulse 1.6s infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(255,111,111,.6)}70%{box-shadow:0 0 0 8px rgba(255,111,111,0)}100%{box-shadow:0 0 0 0 rgba(255,111,111,0)}}

input.field,textarea.field,select.field{width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r3);border:1px solid var(--stroke2);
  background:rgba(0,0,0,.28);color:var(--ink);font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
input.field:focus,textarea.field:focus{border-color:var(--accentLine);box-shadow:0 0 0 3px var(--accentDim)}
input[type=datetime-local].field,input[type=date].field{display:block}
label.lbl{display:block;font-size:13px;color:var(--ink2);margin:var(--s3) 0 6px;font-weight:550}

/* ---------- Header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:2px 2px var(--s3)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.brand .t1{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.brand .t2{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Map ---------- */
.mapcard{position:relative;padding:0;overflow:hidden;height:clamp(300px,50vh,470px)}
#map,#pmap{position:absolute;inset:0;background:#0b1320}
.leaflet-container{background:#0b1320;font-family:var(--font)}
.leaflet-control-attribution{background:rgba(5,8,13,.6)!important;color:var(--ink3)!important;font-size:10px!important;border-top-left-radius:8px}
.leaflet-control-attribution a{color:var(--ink2)!important}
.mapbtns{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapbtn{min-height:36px;padding:0 12px;border-radius:var(--r4);border:1px solid var(--stroke2);background:rgba(10,18,30,.72);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  color:var(--ink);font-size:13px;font-weight:600;box-shadow:var(--spec),0 4px 14px rgba(0,0,0,.35)}
.mapbtn.on{color:#04131d;background:linear-gradient(180deg,#9fe2ff,#5cc4f2)}
.recenter{position:absolute;right:10px;bottom:26px;z-index:500;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--stroke2);background:rgba(10,18,30,.78);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--ink);box-shadow:var(--spec),0 4px 14px rgba(0,0,0,.4)}
.recenter.on{color:var(--accent)}
.recenter:active{transform:scale(.94)}
.rider{position:relative}
.rider .core{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 14px rgba(127,214,255,.9)}
.rider .ring{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);animation:ring 2s ease-out infinite}
.rider.stale .core{border-color:var(--warn);box-shadow:0 0 12px rgba(255,200,100,.7)}
.rider.stale .ring{border-color:var(--warn)}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
.flag{width:14px;height:14px;border-radius:4px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.flag.s{background:var(--ok)}
.flag.f{background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/7px 7px}

/* ---------- Stats ---------- */
.hero{text-align:center;padding:var(--s5) var(--s4)}
.hero .k{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:650}
.hero .big{font-size:52px;font-weight:750;letter-spacing:-.02em;margin:6px 0 4px;background:linear-gradient(180deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);padding:var(--s2)}
.stat{padding:var(--s3) var(--s3) 10px;border-radius:var(--r2);background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.06)}
.stat .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:650}
.stat .v{font-size:30px;font-weight:720;letter-spacing:-.02em;margin-top:2px;line-height:1.1}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:3px;letter-spacing:0}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between}
.stat.wide .v{font-size:26px}
.prog{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin:4px var(--s2) var(--s2)}
.prog i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#4fb6e8,var(--accent2));box-shadow:0 0 12px rgba(127,214,255,.6);transition:width .8s ease}
.seen{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s3) var(--s4)}
.seen .msg{font-size:14px;color:var(--ink2);line-height:1.35}
.zone{margin-top:6px;padding:10px 12px;border-radius:var(--r3);background:rgba(255,200,100,.10);border:1px solid rgba(255,200,100,.28);color:#ffe2a8;font-size:14px;line-height:1.35}

/* ---------- Cheers ---------- */
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s2);margin:var(--s3) 0}
.qbtn{position:relative;height:64px;border-radius:var(--r2);border:1px solid var(--stroke2);background:var(--glass2);box-shadow:var(--spec);font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .1s}
.qbtn:active{transform:scale(.92)}
.qbtn .c{font-size:11.5px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1}
.qbtn.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.14)}}
.msgbox{display:flex;gap:var(--s2);align-items:stretch}
.msgbox .btn{flex:none;min-width:76px}
.msgbox .btn.mic{min-width:48px;padding:0 10px;font-size:20px}
.voicebox{margin-top:var(--s2);padding:var(--s3);border-radius:var(--r2);background:rgba(0,0,0,.25);border:1px solid var(--stroke)}
.voicebox .rec{display:flex;align-items:center;gap:10px;font-weight:650}
.recdot{width:12px;height:12px;border-radius:50%;background:var(--bad);animation:livepulse 1.2s infinite}
.vbar{height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin:10px 0}
.vbar i{display:block;height:100%;width:0;background:var(--bad);transition:width .25s linear}
.feed{list-style:none;margin:var(--s3) 0 0;padding:0;max-height:360px;overflow:auto;-webkit-overflow-scrolling:touch}
.feed li{display:flex;gap:10px;padding:10px 2px;border-top:1px solid rgba(255,255,255,.06);font-size:15px;line-height:1.35}
.feed li:first-child{border-top:0}
.feed .who{font-weight:650}
.feed .when{margin-left:auto;color:var(--ink3);font-size:12px;white-space:nowrap;padding-left:8px}
.feed .av{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--accentDim);color:var(--accent2);border:1px solid var(--accentLine)}
.feed li.new{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}}
.feed .hid{opacity:.45;text-decoration:line-through}

/* ---------- Sheet / toast ---------- */
.scrim{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:var(--s4) var(--s4) calc(env(safe-area-inset-bottom) + var(--s4))}
.sheet{width:100%;max-width:520px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(var(--topPad) + 4px);transform:translateX(-50%);z-index:1100;padding:10px 16px;border-radius:var(--r4);background:rgba(16,26,40,.9);border:1px solid var(--stroke2);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.update{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);z-index:1100}

/* ---------- Admin ---------- */
.kv{display:flex;justify-content:space-between;gap:var(--s3);padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:15px}
.kv:first-of-type{border-top:0}
.kv .k{color:var(--ink2)}
.kv .v{text-align:right;font-weight:600}
.statusbig{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:720;margin-bottom:var(--s2)}
.btngrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}
.copyrow{display:flex;gap:var(--s2);align-items:center;margin-top:6px}
.copyrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;padding:11px 12px;border-radius:var(--r3);background:rgba(0,0,0,.32);border:1px solid var(--stroke)}
.copyrow .btn{min-height:40px;flex:none}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:6px 0}
.sw{position:relative;width:52px;height:32px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid var(--stroke2);transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:.2s}
.sw input:checked+span{background:var(--warn)}
.sw.ok input:checked+span{background:var(--ok)}
.btn.big{min-height:58px;font-size:18px;border-radius:var(--r2)}
.rmfeed{max-height:none}
/* ---------- Race Mode (CarPlay-style) ---------- */
.rmx{max-width:560px;margin:0 auto;padding:var(--topPad) 14px calc(env(safe-area-inset-bottom) + 30px);display:flex;flex-direction:column;gap:12px}
.rm-side{order:1;display:flex;flex-direction:column;gap:10px}
.rm-map{order:2;position:relative;height:40vh;min-height:250px;border-radius:var(--r1);overflow:hidden;border:1px solid var(--stroke);box-shadow:var(--spec),var(--shadow)}
.rm-more{order:3}
#rmMap{position:absolute;inset:0;background:#0b1320}
.rm-bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rm-bar-r{display:flex;gap:12px;align-items:center}
.rm-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:99px;font-size:15px;font-weight:700;border:1px solid var(--stroke2);background:var(--glass2)}
.rm-pill.live{border-color:rgba(255,111,111,.5);color:#ffd6d6}
.rm-pill.arm{border-color:var(--accentLine);color:var(--accent2)}
.rm-mini{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--ink2)}
.rm-hero,.rm-tile,.rm-banner{background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--spec),var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.rm-hero{border-radius:var(--r1);padding:16px;text-align:center}
.rm-k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.rm-big{font-size:96px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:4px 0 2px;background:linear-gradient(180deg,#fff,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rm-big small{font-size:26px;font-weight:700;margin-left:4px;letter-spacing:0}
.rm-sub{color:var(--ink2);font-size:15px;min-height:18px}
.rm-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rm-tile{border-radius:var(--r2);padding:10px 8px;text-align:center}
.rm-v{font-size:26px;font-weight:750;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.rm-v small{font-size:12px;font-weight:650;color:var(--ink2);margin-left:2px}
.rm-banner{border-radius:var(--r2);padding:12px 14px;display:flex;align-items:center;gap:12px;transition:box-shadow .3s,border-color .3s}
.rm-banner .av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;background:var(--accentDim);color:var(--accent2);border:1px solid var(--accentLine)}
.rm-bt{font-size:18px;font-weight:650;line-height:1.3;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rm-banner.flash{border-color:var(--accentLine);box-shadow:0 0 0 3px var(--accentDim),var(--shadow)}
.rm-banner.playing{border-color:rgba(91,227,160,.45);background:linear-gradient(180deg,rgba(91,227,160,.18),rgba(91,227,160,.06))}
.rm-eq{flex:none;width:40px;height:40px;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding-bottom:8px}
.rm-eq i{width:5px;border-radius:3px;background:var(--ok);animation:eq .9s ease-in-out infinite}
.rm-eq i:nth-child(2){animation-delay:.15s}.rm-eq i:nth-child(3){animation-delay:.3s}.rm-eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:6px}50%{height:24px}}
.rm-go{min-height:64px;font-size:20px;border-radius:var(--r2)}
.rm-checks{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.rm-check{display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 12px;border-radius:var(--r3);background:rgba(0,0,0,.25);border:1px solid var(--stroke)}
.rm-check.bad{border-color:rgba(255,111,111,.35)}
.rm-mini-btn{min-height:32px;font-size:12px;margin-left:auto;padding:0 10px;flex:none}
@media (orientation:landscape) and (max-height:600px){
  body.rmode{overflow:hidden}
  .rmx{max-width:none;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;height:100vh;height:100dvh;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
  .rm-map{grid-column:1;grid-row:1;height:auto;min-height:0}
  .rm-side{grid-column:2;grid-row:1;overflow:auto;gap:8px;padding-bottom:6px}
  .rm-more{display:none}
  .rm-hero{padding:8px 10px}
  .rm-big{font-size:60px}
  .rm-v{font-size:20px}
  .rm-bt{font-size:16px}
  .rm-go{min-height:52px}
}

</head>
<body>
<div id="app"></div>
<script src="/vendor/leaflet.js"></script>
<script>
'use strict';
const APP_VERSION = 'breakaway-4';
const QUICK = ['🔥', '👏', '💪', '🚴', '❄️'];
const MI = 1609.344;
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');

// ---------- utils ----------
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
let skew = 0; // server clock − device clock
const now = () => Date.now() + skew;
function clock(iso) { if (!iso) return '—'; return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function dayLabel(iso) { return new Date(iso).toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); }
function dur(sec) {
  if (sec == null || !isFinite(sec)) return '—';
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}
function countdown(sec) {
  if (sec > 86400) { const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600); return `${d}d ${h}h`; }
  return dur(sec);
}
function ago(iso) {
  if (!iso) return 'Never';
  const s = Math.max(0, Math.round((now() - Date.parse(iso)) / 1000));
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 48) return `${h}h ${m % 60}m ago`;
  return `${Math.floor(h / 24)}d ago`;
}
function shortAgo(iso) { return ago(iso).replace(' ago', ''); }
function toast(msg, ms = 2400) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
let updateShown = false;
function showUpdate() {
  if (updateShown) return; updateShown = true;
  const b = document.createElement('button'); b.className = 'btn primary update'; b.textContent = 'Update Ready · Tap to Reload';
  b.onclick = () => location.reload(); document.body.appendChild(b);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast('Copied');
}
function deviceId() {
  let d = store.get('ba_device');
  if (!d) { d = 'd' + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('ba_device', d); }
  return d;
}
// Satellite is the default (no key needed). "Map" = OpenStreetMap (no key needed).
function tiles() {
  const sat = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18, attribution: 'Imagery © Esri' }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18, opacity: .85 })
  ]);
  return {
    sat,
    map: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' })
  };
}
// Keep the map around the race: can't pan or zoom far away from the course.
function lockToCourse(map, bounds) {
  if (!bounds) return;
  const box = bounds.pad(0.12);
  map.setMaxBounds(box);
  map.options.maxBoundsViscosity = 1.0;
  map.setMinZoom(Math.max(7, map.getBoundsZoom(box) - 1));
}
const RECENTER_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 2.3a1 1 0 0 0-1.06-.23l-18 7a1 1 0 0 0 .08 1.9l7.6 2.18 2.18 7.6a1 1 0 0 0 1.9.08l7-18a1 1 0 0 0-.23-1.06z"/></svg>';
function flagIcon(cls) { return L.divIcon({ className: '', html: `<div class="flag ${cls}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] }); }
function drawCourse(map, pts, layerGroup) {
  layerGroup.clearLayers();
  if (!pts || pts.length < 2) return null;
  const ll = pts.map((p) => [p[0], p[1]]);
  L.polyline(ll, { color: '#02060b', weight: 8, opacity: .55, interactive: false }).addTo(layerGroup);
  L.polyline(ll, { color: '#7fd6ff', weight: 4, opacity: .42, interactive: false }).addTo(layerGroup);
  L.marker(ll[0], { icon: flagIcon('s'), interactive: false, keyboard: false }).addTo(layerGroup);
  L.marker(ll[ll.length - 1], { icon: flagIcon('f'), interactive: false, keyboard: false }).addTo(layerGroup);
  return L.latLngBounds(ll);
}

// Press-and-hold button (for things you never want to hit by accident).
function holdBtn(btn, ms, fn) {
  let t = null, start = 0, raf = null;
  const fill = btn.querySelector('.holdfill');
  const reset = () => { clearTimeout(t); cancelAnimationFrame(raf); t = null; if (fill) fill.style.width = '0%'; };
  const tick = () => { if (!t) return; if (fill) fill.style.width = Math.min(100, (Date.now() - start) / ms * 100) + '%'; raf = requestAnimationFrame(tick); };
  const down = (e) => { e.preventDefault(); start = Date.now(); t = setTimeout(() => { reset(); if (navigator.vibrate) navigator.vibrate(30); fn(); }, ms); tick(); };
  btn.addEventListener('pointerdown', down);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => btn.addEventListener(ev, reset));
  btn.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ---------- sounds ----------
let actx = null;
function unlockChime() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {}
}
// A short bell; each cheer emoji gets its own note.
function chime(i = 0) {
  try {
    unlockChime(); if (!actx) return;
    const base = [659.25, 783.99, 880, 987.77, 1174.66][((i % 5) + 5) % 5];
    const t = actx.currentTime;
    [[1, 0.22, 0.8], [2, 0.07, 0.45], [3.01, 0.03, 0.25]].forEach(([m, peak, len]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = base * m;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + len + 0.05);
    });
  } catch {}
}
function blobToB64(b) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); });
}
// 16-bit mono WAV from a sample function (used for Race Mode's keep-alive + chime, no files needed).
function makeWav(seconds, rate, fn) {
  const n = Math.floor(seconds * rate), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.round(fn(i / rate) * 32767))), true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

// ---------- routing ----------
const params = new URLSearchParams(location.search);
const urlKey = params.get('k');
if (urlKey) store.set('ba_view', urlKey);
// Each screen lives at its own path and never sends you to another one.
function route() {
  const p = location.pathname.replace(/\/+$/, '') || '/';
  if (p === '/race') return RaceMode();
  if (p === '/admin') return Admin();
  const k = urlKey || store.get('ba_view');
  if (k) return Live(k);
  return Landing();
}

function Landing() {
  $('#app').innerHTML = `<div class="wrap"><div class="top"><div class="brand"><img src="/icons/icon-192.png" alt=""><div><div class="t1">Breakaway</div><div class="t2">Live Race Tracking</div></div></div></div>
  <div class="card hero"><div class="k">Following Someone?</div><h3 style="margin-top:10px">Open the Share Link They Sent You</h3><p class="sub">This page needs the full link (it ends in <b>?k=…</b>).</p></div></div>`;
}

// =====================================================================
// LIVE (spectator)
// =====================================================================
function Live(key) {
  let S = null, course = null, courseVer = -1, trail = [], lastId = 0, epoch = 0;
  let follow = true, firstFit = false, zoomedToRider = false, timer = null, inflight = false, failCount = 0;
  let pendingTaps = {}, tapTimer = null, localBump = {}, feedSeen = new Set(), msgCooldownUntil = 0;
  let name = store.get('ba_name') || '';

  $('#app').innerHTML = `<div class="wrap">
    <div class="top">
      <div class="brand"><img src="/icons/icon-192.png" alt=""><div style="min-width:0"><div class="t1">Breakaway</div><div class="t2" id="rname">Loading…</div></div></div>
      <span class="pill" id="chip"><span class="dot"></span><span>…</span></span>
    </div>
    <div id="heroSlot"></div>
    <div id="notifySlot"></div>
    <div class="card mapcard"><div id="map"></div>
      <div class="mapbtns"><button class="mapbtn" id="layerBtn">Map</button></div>
      <button class="recenter on" id="recBtn" aria-label="Recenter Map">${RECENTER_SVG}</button>
    </div>
    <div class="card" style="padding:0" id="statsCard">
      <div class="stats">
        <div class="stat"><div class="k">Miles Done</div><div class="v num" id="sDone">—</div></div>
        <div class="stat"><div class="k">Miles Left</div><div class="v num" id="sLeft">—</div></div>
        <div class="stat"><div class="k">Current Speed</div><div class="v num" id="sSpeed">—</div></div>
        <div class="stat"><div class="k">ETA to Finish</div><div class="v num" id="sEta">—</div></div>
        <div class="stat wide"><div class="k">Elapsed</div><div class="v num" id="sElapsed">—</div></div>
      </div>
      <div class="prog"><i id="progBar"></i></div>
      <div class="seen"><div class="row"><span class="dot" id="seenDot"></span><span class="msg" id="seenTxt">Waiting for GPS…</span></div><span class="pill num" id="batt">🔋 —</span></div>
      <div id="zoneSlot" style="padding:0 var(--s4) var(--s3)"></div>
    </div>
    <div class="card" id="cheerCard">
      <h3 id="cheerTitle">Send a Cheer</h3>
      <div class="sub">Taps and messages pop up on his Apple Watch. Voice messages play out loud on his phone.</div>
      <div class="quick">${QUICK.map((e) => `<button class="qbtn" data-e="${e}" aria-label="Cheer ${e}"><span>${e}</span><span class="c num">0</span></button>`).join('')}</div>
      <div class="msgbox"><input class="field grow" id="msg" maxlength="140" placeholder="Write a message…" enterkeyhint="send" autocomplete="off"><button class="btn mic" id="micBtn" aria-label="Record Voice Message">🎙️</button><button class="btn primary" id="sendBtn">Send</button></div>
      <div class="voicebox hidden" id="voiceBox"></div>
      <div class="row" style="justify-content:space-between;margin-top:6px"><span class="tiny" id="asName"></span><span class="tiny num" id="msgCount">0/140</span></div>
      <p class="tiny" style="margin:10px 0 0">🔒 Your messages are private. Only you and <span class="rn">Joe</span> see them. Emoji taps are shared with everyone.</p>
      <ul class="feed" id="feed"></ul>
    </div>
    <p class="tiny" style="text-align:center;margin-top:var(--s4)">GPS from his phone · not official timing · ${APP_VERSION}</p>
  </div>`;

  // map
  const map = L.map('map', { zoomControl: false, attributionControl: true, tap: true }).setView([44.73, -85.37], 10);
  map.attributionControl.setPrefix(false);
  const T = tiles(); let layer = 'sat'; T.sat.addTo(map);
  const courseLayer = L.layerGroup().addTo(map);
  const trailLine = L.polyline([], { color: '#7fd6ff', weight: 5, opacity: .95, lineJoin: 'round', interactive: false }).addTo(map);
  let rider = null, courseBounds = null;
  const setFollow = (on) => { follow = on; $('#recBtn').classList.toggle('on', on); };
  map.on('dragstart', () => setFollow(false));
  // Recenter: back to Joe (live) or the whole course (before/after).
  $('#recBtn').onclick = () => {
    setFollow(true);
    if (S && S.cur && S.status === 'live') map.setView([S.cur.lat, S.cur.lon], Math.max(map.getZoom(), 14));
    else if (courseBounds) map.fitBounds(courseBounds, { padding: [24, 24] });
  };
  $('#layerBtn').onclick = () => {
    map.removeLayer(T[layer]); layer = layer === 'map' ? 'sat' : 'map'; T[layer].addTo(map);
    $('#layerBtn').textContent = layer === 'map' ? 'Satellite' : 'Map';
  };

  async function loadCourse() {
    const r = await fetch(`/api/state?k=${encodeURIComponent(key)}&part=course`, { cache: 'no-store' });
    const j = await r.json();

  }

  async function poll() {
    if (inflight) return; inflight = true; clearTimeout(timer);
    try {
      const r = await fetch(`/api/state?k=${encodeURIComponent(key)}&since=${lastId}&epoch=${epoch}&d=${deviceId()}`, { cache: 'no-store' });
      if (r.status === 403) { badLink(); return; }
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || r.status);

      if (j.now) skew = Date.parse(j.now) - Date.now();
      if (j.v && j.v !== APP_VERSION) showUpdate();
      if (j.epoch !== epoch) { trail = []; lastId = 0; epoch = j.epoch; if (j.points && j.points.length && j.points[0][0] > 0) {} }
      for (const p of j.points || []) { trail.push([p[1], p[2]]); lastId = Math.max(lastId, p[0]); }

    else if (S.status === 'not_started' || S.status === 'setup') {

    }
    timer = setTimeout(poll, ms);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); else clearTimeout(timer); });

  function badLink() {
    store.del('ba_view');

  }

  function render() {
    if (!S) return;
    const rn = S.rider || 'Joe';
    $('#rname').textContent = S.name || 'Breakaway';
    document.title = `${rn} · ${S.name || 'Breakaway'}`;

    // chip
    const chip = $('#chip');
    if (S.status === 'live') chip.innerHTML = `<span class="dot live"></span><span>Live</span>`;
    else if (S.status === 'finished') chip.innerHTML = `<span class="dot ok"></span><span>Finished</span>`;

    $('#sEta').innerHTML = live && S.eta ? clock(S.eta) : (fin ? clock(S.finishedAt) : '—');

    // map
    trailLine.setLatLngs(trail);

      const ll = [S.cur.lat, S.cur.lon];

        rider = L.marker(ll, { icon: L.divIcon({ className: 'rider', html: '<div class="ring"></div><div class="core"></div>', iconSize: [0, 0] }), zIndexOffset: 1000, interactive: false }).addTo(map);
      } else rider.setLatLng(ll);
      const stale = now() - Date.parse(S.cur.ts) > 180000;
      rider.getElement() && rider.getElement().classList.toggle('stale', stale);

      }

    if (fin && trail.length > 1 && !firstFitFinished) { firstFitFinished = true; map.fitBounds(courseBounds || trailLine.getBounds(), { padding: [24, 24] }); }

    // cheers
    for (const b of document.querySelectorAll('.qbtn')) {
      const e = b.dataset.e; const n = (S.totals?.[e] || 0) + (localBump[e] || 0);
      b.querySelector('.c').textContent = n > 999 ? Math.round(n / 100) / 10 + 'k' : n;
    }
    renderFeed();
    renderNotify();
    document.querySelectorAll('.rn').forEach((x) => { x.textContent = rn; });
    $('#micBtn').classList.toggle('hidden', S.voiceOn === false);
    tick();
  }
  let firstFitFinished = false;

  function renderFeed() {
    const ul = $('#feed');

    if (!items.length) { ul.innerHTML = `<li class="tiny" style="justify-content:center">No cheers yet. Be the first!</li>`; return; }
    const first = feedSeen.size === 0;
    ul.innerHTML = items.map((c) => {
      const who = c.name || 'Someone';
      const body = c.kind === 'msg' ? esc(c.text)
        : c.kind === 'voice' ? `🎙️ Voice message${c.audio_secs ? ` · ${Math.round(c.audio_secs)}s` : ''}`

      const isNew = !first && !feedSeen.has(c.id);
      return `<li class="${isNew ? 'new' : ''}"><span class="av">${esc(who.slice(0, 1).toUpperCase())}</span><div class="grow"><span class="who">${esc(who)}</span> ${body}${c.mine ? `<div class="tiny">🔒 Only you and ${esc(S.rider || 'Joe')} see this</div>` : ''}</div><span class="when" data-t="${esc(c.created_at)}">${shortAgo(c.created_at)}</span></li>`;
    }).join('');

  }

  function tick() {
    if (!S) return;

      if (sec > 0) { $('#cdLabel').textContent = 'Starts In'; $('#cd').textContent = countdown(sec); }

    }
    if (S.status === 'live' && S.startedAt) $('#sElapsed').textContent = dur((now() - Date.parse(S.startedAt)) / 1000);
    else if (S.status === 'finished' && S.startedAt && S.finishedAt) $('#sElapsed').textContent = dur((Date.parse(S.finishedAt) - Date.parse(S.startedAt)) / 1000);
    else $('#sElapsed').textContent = '—';
    // last seen
    const dotEl = $('#seenDot'), txt = $('#seenTxt'), zone = $('#zoneSlot');
    if (failCount >= 2) return;
    if (S.status === 'finished') { dotEl.className = 'dot ok'; txt.textContent = `Finished at ${clock(S.finishedAt)}. Live location is off.`; zone.innerHTML = ''; }
    else if (!S.lastSeen) {
      dotEl.className = 'dot'; zone.innerHTML = '';
      txt.textContent = S.status === 'live' ? 'Waiting for the first GPS point…' : 'Location shows up near the start time.';
    } else {
      const s = (now() - Date.parse(S.lastSeen)) / 1000;
      dotEl.className = 'dot ' + (s < 90 ? 'ok' : s < 180 ? 'warn' : 'bad');
      txt.textContent = `Last Seen ${ago(S.lastSeen)}`;
      zone.innerHTML = s >= 180 && S.status === 'live' ? `<div class="zone">Probably in a dead zone. Points will catch up.</div>` : '';
    }
    for (const w of document.querySelectorAll('#feed .when')) w.textContent = shortAgo(w.dataset.t);
    const left = Math.ceil((msgCooldownUntil - Date.now()) / 1000);
    const sb = $('#sendBtn');
    if (left > 0) { sb.disabled = true; sb.textContent = `${left}s`; } else if (sb.disabled && sb.textContent !== 'Send' && !sb.dataset.busy) { sb.disabled = false; sb.textContent = 'Send'; }
  }
  setInterval(tick, 1000);

  // ----- name -----
  function updateName() { $('#asName').innerHTML = name ? `Sending as <b>${esc(name)}</b> · <a href="#" id="chgName" style="color:var(--accent)">Change</a>` : ''; const c = $('#chgName'); if (c) c.onclick = (e) => { e.preventDefault(); askName(); }; }
  function askName() {
    return new Promise((resolve) => {
      const sc = document.createElement('div'); sc.className = 'scrim';
      sc.innerHTML = `<div class="card sheet"><h3>What’s Your Name?</h3><p class="sub" style="margin-top:0">So ${esc(S?.rider || 'Joe')} knows who’s cheering. Saved on this phone.</p>
        <input class="field" id="nameIn" maxlength="24" placeholder="Your name" autocomplete="given-name" value="${esc(name)}">
        <div class="row" style="margin-top:12px"><button class="btn grow" id="nCancel">Cancel</button><button class="btn primary grow" id="nSave">Save</button></div></div>`;
      document.body.appendChild(sc);
      const inp = $('#nameIn', sc); setTimeout(() => inp.focus(), 50);
      const done = (v) => { sc.remove(); updateName(); resolve(v); };
      $('#nCancel', sc).onclick = () => done(null);
      const save = () => { const v = inp.value.trim().slice(0, 24); if (!v) { inp.focus(); return; } name = v; store.set('ba_name', v); done(v); };
      $('#nSave', sc).onclick = save; inp.onkeydown = (e) => { if (e.key === 'Enter') save(); };
    });
  }
  updateName();

  async function post(body) {
    const r = await fetch('/api/cheer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: key, v: APP_VERSION, device: deviceId(), name, ...body }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) { showUpdate(); throw new Error('A new version is ready. Tap reload.'); }
    if (!r.ok) { const e = new Error(j.error || 'Could not send'); e.wait = j.wait; e.status = r.status; throw e; }
    return j;
  }

  // ----- quick taps (batched) -----
  document.querySelectorAll('.qbtn').forEach((b) => {
    b.onclick = async () => {
      unlockChime();
      if (!name) { const n = await askName(); if (!n) return; }
      const e = b.dataset.e;
      chime(QUICK.indexOf(e));
      pendingTaps[e] = (pendingTaps[e] || 0) + 1; localBump[e] = (localBump[e] || 0) + 1;
      b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
      if (navigator.vibrate) navigator.vibrate(10);
      const n = (S?.totals?.[e] || 0) + localBump[e]; b.querySelector('.c').textContent = n;
      clearTimeout(tapTimer); tapTimer = setTimeout(flushTaps, 1300);
    };
  });
  async function flushTaps() {
    const batch = pendingTaps; pendingTaps = {};
    for (const [emoji, count] of Object.entries(batch)) {
      let left = count;
      while (left > 0) {
        const c = Math.min(10, left);
        try { await post({ kind: 'quick', emoji, count: c }); left -= c; }
        catch (err) {
          if (err.status === 429) { await new Promise((r) => setTimeout(r, 1700)); continue; }
          localBump[emoji] = Math.max(0, (localBump[emoji] || 0) - left); toast(err.message); left = 0;
        }
        if (left > 0) await new Promise((r) => setTimeout(r, 1600));
      }
    }
    const fresh = await fetch(`/api/state?k=${encodeURIComponent(key)}&since=${lastId}&epoch=${epoch}&d=${deviceId()}`, { cache: 'no-store' }).then((r) => r.json()).catch(() => null);
    if (fresh && fresh.epoch === epoch) { for (const p of fresh.points || []) { trail.push([p[1], p[2]]); lastId = Math.max(lastId, p[0]); } localBump = {}; S = fresh; render(); }
  }

  // ----- "Notify me when Joe starts" (web push) -----
  let notifyKey = '';
  function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
  function renderNotify() {
    const el = $('#notifySlot'); if (!el || !S) return;
    const rn = S.rider || 'Joe';
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
    const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    let state = 'hide';
    if (S.vapid && S.status !== 'finished') {
      if (pushSupported()) state = store.get('ba_push') === '1' && Notification.permission === 'granted' ? 'on' : 'off';
      else if (isIOS && !standalone) state = 'ios';
    }
    const key = state + rn;
    if (key === notifyKey) return; notifyKey = key;
    if (state === 'hide') { el.innerHTML = ''; return; }
    if (state === 'on') {
      el.innerHTML = `<div class="card row" style="padding:12px 16px"><span style="font-size:22px">🔔</span><div class="grow"><div style="font-weight:650">Notifications On</div><div class="tiny">You’ll get a push when ${esc(rn)} starts and finishes.</div></div><button class="btn" id="nOff" style="min-height:36px;font-size:13px">Turn Off</button></div>`;
      $('#nOff').onclick = unsubscribe;
    } else if (state === 'off') {
      el.innerHTML = `<div class="card row" style="padding:12px 16px"><span style="font-size:22px">🔔</span><div class="grow"><div style="font-weight:650">Get a Push When ${esc(rn)} Starts</div><div class="tiny">And when he finishes. Nothing else.</div></div><button class="btn primary" id="nOn" style="min-height:40px">Notify Me</button></div>`;
      $('#nOn').onclick = subscribe;
    } else {
      el.innerHTML = `<div class="card" style="padding:14px 16px"><div class="row"><span style="font-size:22px">🔔</span><div style="font-weight:650">Want a Push When ${esc(rn)} Starts?</div></div>
        <ol class="tips" style="margin-top:6px"><li>Tap <b>Share</b> (the square with the arrow)</li><li>Tap <b>Add to Home Screen</b></li><li>Open <b>Breakaway</b> from your home screen and tap <b>Notify Me</b></li></ol>
        <div class="tiny" style="margin-top:6px">iPhone only allows website notifications from the home screen.</div></div>`;
    }
  }
  function b64u(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, (c) => c.charCodeAt(0)); }
  async function subscribe() {
    const btn = $('#nOn');
    try {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { toast('Notifications were blocked. You can allow them in Settings.', 3500); return; }
      if (btn) { btn.disabled = true; btn.textContent = '…'; }
      const reg = await navigator.serviceWorker.register('/sw.js');
      await navigator.serviceWorker.ready;
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(S.vapid) });
      const r = await fetch('/api/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: key, v: APP_VERSION, action: 'subscribe', sub: sub.toJSON(), device: deviceId(), name }) });
      if (r.status === 409) { showUpdate(); throw new Error('A new version is ready. Tap reload.'); }
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'Couldn’t turn on notifications'); }
      store.set('ba_push', '1'); notifyKey = ''; renderNotify();
      toast('Notifications on ✓');
    } catch (e) { toast(e.message || 'Couldn’t turn on notifications', 3500); notifyKey = ''; renderNotify(); }
  }
  async function unsubscribe() {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      const sub = reg && await reg.pushManager.getSubscription();
      if (sub) {
        await fetch('/api/notify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ k: key, v: APP_VERSION, action: 'unsubscribe', sub: sub.toJSON() }) }).catch(() => {});
        await sub.unsubscribe();
      }
    } catch {}
    store.del('ba_push'); notifyKey = ''; renderNotify(); toast('Notifications off');
  }

  // ----- voice messages (15 s max) -----
  let rec = null, recChunks = [], recStart = 0, recTimer = null, recBlob = null, recSecs = 0, voiceCooldownUntil = 0;
  const micBtn = $('#micBtn'), vbox = $('#voiceBox');
  micBtn.onclick = async () => {
    if (rec && rec.state === 'recording') return stopRec();
    if (Date.now() < voiceCooldownUntil) { toast(`Wait ${Math.ceil((voiceCooldownUntil - Date.now()) / 1000)}s before the next voice message`); return; }
    if (!name) { const n = await askName(); if (!n) return; }
    if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Voice messages need a newer browser'); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { toast('Allow the microphone to record a voice message', 3500); return; }
    const types = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    const want = types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || '';
    try { rec = new MediaRecorder(stream, want ? { mimeType: want, audioBitsPerSecond: 64000 } : undefined); }
    catch { rec = new MediaRecorder(stream); }
    recChunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      recSecs = Math.min(15, (Date.now() - recStart) / 1000);
      recBlob = new Blob(recChunks, { type: (rec.mimeType || want || 'audio/mp4').split(';')[0] });
      if (recSecs < 0.8 || recBlob.size < 800) { vbox.classList.add('hidden'); vbox.innerHTML = ''; toast('Too short. Hold on a sec longer.'); return; }
      showPreview();
    };
    rec.start(250); recStart = Date.now();
    micBtn.textContent = '■'; micBtn.classList.add('danger');
    vbox.classList.remove('hidden');
    vbox.innerHTML = `<div class="rec"><span class="recdot"></span><span>Recording</span><span class="num" id="recT" style="margin-left:auto">0:00 / 0:15</span></div>
      <div class="vbar"><i id="recBar"></i></div><button class="btn danger block" id="recStop">Stop</button>`;
    $('#recStop').onclick = stopRec;
    recTimer = setInterval(() => {
      const t = (Date.now() - recStart) / 1000;
      const el = $('#recT'); if (el) el.textContent = `0:${String(Math.min(15, Math.floor(t))).padStart(2, '0')} / 0:15`;
      const bar = $('#recBar'); if (bar) bar.style.width = Math.min(100, t / 15 * 100) + '%';
      if (t >= 15) stopRec();
    }, 250);
  };
  function stopRec() {
    clearInterval(recTimer);
    if (rec && rec.state === 'recording') rec.stop();
    micBtn.textContent = '🎙️'; micBtn.classList.remove('danger');
  }
  function showPreview() {
    const url = URL.createObjectURL(recBlob);
    vbox.innerHTML = `<div class="rec">🎙️ <span>Voice message · ${Math.max(1, Math.round(recSecs))}s</span></div>
      <audio controls src="${url}" style="width:100%;margin:10px 0"></audio>
      <div class="row"><button class="btn grow" id="vDiscard">Discard</button><button class="btn primary grow" id="vSend">Send Voice</button></div>`;
    $('#vDiscard').onclick = () => { vbox.classList.add('hidden'); vbox.innerHTML = ''; recBlob = null; };
    $('#vSend').onclick = sendVoice;
  }
  async function sendVoice() {
    const btn = $('#vSend'); btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const audio = await blobToB64(recBlob);
      await post({ kind: 'voice', audio, mime: recBlob.type, secs: recSecs });
      vbox.classList.add('hidden'); vbox.innerHTML = ''; recBlob = null;
      voiceCooldownUntil = Date.now() + 60000;
      toast(`Voice message sent to ${S?.rider || 'Joe'} ✓`);
      poll();
    } catch (err) {
      if (err.wait) voiceCooldownUntil = Date.now() + err.wait * 1000;
      toast(err.message, 3500); btn.disabled = false; btn.textContent = 'Send Voice';
    }
  }

  // ----- messages -----
  const msgIn = $('#msg');
  msgIn.oninput = () => { $('#msgCount').textContent = `${msgIn.value.length}/140`; };
  msgIn.onkeydown = (e) => { if (e.key === 'Enter') sendMsg(); };
  $('#sendBtn').onclick = sendMsg;
  async function sendMsg() {
    const text = msgIn.value.trim();
    if (!text) { msgIn.focus(); return; }
    if (Date.now() < msgCooldownUntil) return;
    if (!name) { const n = await askName(); if (!n) return; }
    const sb = $('#sendBtn'); sb.disabled = true; sb.dataset.busy = '1'; sb.textContent = '…';
    try {
      await post({ kind: 'msg', text });
      msgIn.value = ''; $('#msgCount').textContent = '0/140';
      msgCooldownUntil = Date.now() + 20000;
      toast(`Sent to ${S?.rider || 'Joe'} ✓`);
      poll();
    } catch (err) {
      if (err.wait) msgCooldownUntil = Date.now() + err.wait * 1000;
      toast(err.message);
    } finally {
      delete sb.dataset.busy;
      if (Date.now() >= msgCooldownUntil) { sb.disabled = false; sb.textContent = 'Send'; }
    }
  }

  poll();
}

  function login(err) {

</div>

    $('#mute').onchange = (e) => act({ action: 'mute', on: e.target.checked }, e.target.checked ? 'Muted' : 'Unmuted');

      ${D.share ? `<div class="copyrow"><code>${esc(D.share)}</code></div>
      <div class="btngrid"><button class="btn primary" data-copy="${esc(D.share)}">Copy Share Link</button><a class="btn" href="${esc(D.share)}" target="_blank" rel="noopener">Preview Live View</a></div>` : `<p class="sub">Set BREAKAWAY_VIEW_KEY in Vercel first.</p>`}
      <div class="kv" style="margin-top:10px"><span class="k">Followers With Notifications On</span><span class="v num">${D.followers?.ready ? (D.followers.count ?? 0) : 'Not set up'}</span></div>
      ${D.followers?.ready ? `<button class="btn block" id="bNotifyTest" style="margin-top:6px">Send Test to Followers</button>` : ''}
      <p class="tiny" style="margin-top:6px">They get a push when you start and when you finish. On iPhone they need to add the Live View to their home screen first, then tap Notify Me.</p>`;
    if ($('#bNotifyTest')) $('#bNotifyTest').onclick = async () => {
      try { const r = await api('POST', { action: 'notify_test' }); const j = await r; toast(`Sent to ${j.sent ?? 0} follower${j.sent === 1 ? '' : 's'}`); } catch (e) { if (e.message !== 'auth') toast(e.message); }

    // ---- setup (render once so typing isn't wiped by refresh) ----

    // ---- overland ----
    const O = D.overland;
    $('#cOverland').innerHTML = `<h2>Overland Setup</h2>

      <label class="lbl">Recommended Settings</label>

        <li>iPhone Settings → Overland → Location: <b>Always</b>, Precise <b>On</b></li>

        <li>Resume with Geofence: <b>Off</b></li>
